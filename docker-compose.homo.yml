version: "3.7"
services:
  chai-homo:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_NGINX:-./config/homo/nginx.env}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - /run/
      - /var/cache/nginx/
      - /etc/nginx/conf.d/
      - /etc/localtime:/etc/localtime:ro
      - ${SSL_CRT:-/etc/default/ssl/brisanet.crt}:/usr/local/share/cert/brisanet.crt:ro
      - ${SSL_KEY:-/etc/default/ssl/brisanet.key}:/usr/local/share/cert/brisanet.key:ro
      - ${SSL_NGINX_MTLS:-/etc/default/mtls/nginx/}:/usr/local/share/mtls/:ro
    
    restart: always